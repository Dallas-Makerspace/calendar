# calendar.dallasmakerspace.org is proxied through Cloudflare, and Traefik (our reverse proxy) has
# no forwardedHeaders/trustedIPs configured, so Apache's default "combined" LogFormat only ever logs
# Traefik's internal container IP as the remote address. Cloudflare's CF-Connecting-IP header carries
# the real visitor IP and passes through Traefik untouched, so we append it here instead. CF-IPCountry
# and CF-IPCity are populated by Cloudflare's "Add visitor location headers" managed transform.
LogFormat "%h %l %u %t \"%r\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\" \"%{CF-Connecting-IP}i\" \"%{CF-IPCountry}i\" \"%{CF-IPCity}i\"" combined
